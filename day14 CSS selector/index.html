<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selector</title>
    <style>
        /* element selctor */
        /* div{
            background-color: brown;
        } */
/* 
        class selector */
        .red{
            background-color: red;
        }

        /* id selector */
        #green{
            background-color: green;
        }
    </style>
</head>
<body>
    <div class="red">
        I am a DIV
    </div>
    <div id="green">
        And my name is Mahi
    </div>
</body>
</html>
