<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Display Inline Example</title>
  <style>
    .inline-demo {
      display: inline;
      background-color: lightblue;
      padding: 5px;
    }
  </style>
</head>
<body>
  <h2>Display Inline Example</h2>
  <p>
    This is a 
    <span class="inline-demo">CSS Inline</span> 
    example inside a paragraph.
  </p>
</body>
</html>
